<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>welcome home</title>
    <style>
        *{box-sizing: border-box;margin:0;padding:0;font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
        body{
            display:flex;
            flex-direction:column;
            align-items:center;
            padding:60px 20px;
            background:#fff;
        }
        .logo{
            width:64px;
            height:64px;
            border-radius:50%;
            background:#24292f;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:32px;
            margin-bottom:16px;
        }
        .title{
            font-size:32px;
            color:#24292f;
            margin-bottom:32px;
        }
        .form-wrap{
            width:340px;
        }
        .item{margin-bottom:16px;}
        label{
            display:block;
            text-align:left;
            margin-bottom:8px;
            font-weight:500;
            color:#24292f;
        }
        .row-link{
            display:flex;
            justify-content:space-between;
        }
        a{color:#0969da;text-decoration:none;font-size:14px;}
        input{
            width:100%;
            padding:8px 12px;
            font-size:16px;
            border:1px solid #d0d7de;
            border-radius:6px;
        }
        .pwd-box{
            position:relative;
        }
        .eye{
            position:absolute;
            right:12px;
            top:50%;
            transform:translateY(-50%);
            cursor:pointer;
        }
        button{
            width:100%;
            padding:10px;
            background:#2da44e;
            color:white;
            border:none;
            border-radius:6px;
            font-size:18px;
            cursor:pointer;
        }
        .tip{color:red;text-align:center;margin:10px 0;}
    </style>
</head>
<body>
    <div class="logo">🐱</div>
    <div class="title">welcome home</div>
    <div class="form-wrap">
        <form id="loginForm">
            <div class="item">
                <label>Username or email address</label>
                <input type="text" id="username" value="admin">
            </div>
            <div class="item">
                <div class="row-link">
                    <label>Password</label>
                    <a href="#">Forgot password?</a>
                </div>
                <div class="pwd-box">
                    <input type="password" id="password" value="123456">
                    <span class="eye" onclick="togglePwd()">🚫</span>
                </div>
            </div>
            <div class="tip" id="msg"></div>
            <button type="submit">Sign in</button>
        </form>
    </div>

    <script>
        // 密码显隐
        function togglePwd(){
            const pwdInput = document.getElementById('password');
            if(pwdInput.type === 'password'){
                pwdInput.type = 'text';
            }else{
                pwdInput.type = 'password';
            }
        }
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', function(e){
            e.preventDefault(); // 阻止表单默认提交
            const user = document.getElementById('username').value.trim();
            const pwd = document.getElementById('password').value.trim();
            // 默认账号密码
            const okUser = 'admin';
            const okPwd = '123456';
            if(user === okUser && pwd === okPwd){
                // ========== 这里改你要跳转的页面 ==========
                window.location.href = 'home.html';
            }else{
                document.getElementById('msg').innerText = '账号密码错误';
            }
        })
    </script>
</body>
</html>
