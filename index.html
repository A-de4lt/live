<!DOCTYPE html>
<html lang="zh-CN" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - 我的网站</title>

    <!-- 自定义样式占位符 - 你可以在这里添加自己的 CSS -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        .auth-container {
            width: 340px;
            margin: 0 auto;
            padding-top: 32px;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-body {
            background-color: #fff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-control {
            width: 100%;
            padding: 5px 12px;
            font-size: 14px;
            line-height: 20px;
            color: #1f2328;
            background-color: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn-primary {
            width: 100%;
            color: #ffffff;
            background-color: #1f883d;
            border: 1px solid rgba(31, 35, 40, 0.15);
            border-radius: 6px;
            padding: 5px 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-primary:hover {
            background-color: #1a7f37;
        }
        .forgot-password {
            float: right;
            font-size: 12px;
            color: #0969da;
            text-decoration: none;
        }
    </style>
</head>

<body class="session-authentication">
    <div class="application-main">
        <main>
            <div class="auth-container">
                <!-- 头部区域 -->
                <div class="auth-header">
                    <h1>欢迎回来</h1>
                </div>

                <!-- 登录表单卡片 -->
                <div class="auth-body">
                    <form action="/api/login" method="post">
                        <div class="form-group">
                            <label for="login_field">用户名或邮箱</label>
                            <input type="text" name="username" id="login_field" class="form-control" autofocus required>
                        </div>

                        <div class="form-group">
                            <label for="password">
                                密码
                                <a class="forgot-password" href="/password_reset">忘记密码？</a>
                            </label>
                            <input type="password" name="password" id="password" class="form-control" required>
                        </div>

                        <input type="submit" value="登录" class="btn-primary">
                    </form>
                </div>

                <!-- 底部提示（可选） -->
                <div class="auth-body" style="margin-top: 15px; text-align: center; font-size: 14px;">
                    还没有账号？ <a href="/signup" style="color: #0969da; text-decoration: none;">创建一个</a>
                </div>
            </div>
        </main>
    </div>

    <!-- 页脚 -->
    <footer class="footer-session" style="margin-top: 40px; text-align: center; color: #6e7781; font-size: 12px;">
        <p>&copy; 2024 Your Company. 版权所有</p>
    </footer>
</body>
</html>
