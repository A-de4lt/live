<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>后台管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="auth.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-slate-800 text-white p-4 flex justify-between">
        <span class="font-bold text-lg">管理员工作台</span>
        <button onclick="logout()" class="bg-red-500 px-3 py-1 rounded text-sm">安全退出</button>
    </nav>

    <div class="p-8 max-w-5xl mx-auto">
        <!-- 统计面板 -->
        <div class="grid grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-4 rounded shadow border-l-4 border-blue-500">
                <p class="text-gray-500 text-sm font-bold">总注册用户</p>
                <p id="userCount" class="text-2xl font-bold">0</p>
            </div>
        </div>

        <!-- 用户管理 -->
        <div class="bg-white p-6 rounded shadow">
            <h3 class="font-bold border-b pb-2 mb-4">用户列表管理</h3>
            <table class="w-full text-left">
                <thead>
                    <tr class="bg-gray-50 text-sm">
                        <th class="p-3">用户名</th>
                        <th>身份角色</th>
                        <th>注册日期</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="userList"></tbody>
            </table>
        </div>
    </div>

    <script>
        const user = checkAccess('admin');

        function render() {
            const users = JSON.parse(localStorage.getItem('sys_users'));
            document.getElementById('userCount').innerText = users.length;
            
            const tbody = document.getElementById('userList');
            tbody.innerHTML = users.map(u => `
                <tr class="border-b text-sm">
                    <td class="p-3">${u.username}</td>
                    <td><span class="px-2 py-0.5 rounded ${u.role==='admin'?'bg-purple-100 text-purple-600':'bg-gray-100'}">${u.role}</span></td>
                    <td>${u.regTime}</td>
                    <td>
                        ${u.username === 'admin' ? '-' : `<button onclick="del(${u.id})" class="text-red-500 underline">删除</button>`}
                    </td>
                </tr>
            `).join('');
        }

        window.del = (id) => {
            if(confirm('确定删除此用户？')) {
                let users = JSON.parse(localStorage.getItem('sys_users'));
                users = users.filter(x => x.id !== id);
                localStorage.setItem('sys_users', JSON.stringify(users));
                render();
            }
        }
        render();
    </script>
</body>
</html>
